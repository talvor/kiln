<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kiln</title>
    <link id="favicon" rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a1a1a'/%3E%3C/svg%3E">
    <style>
    :root {
      --bg: #fafafa;
      --fg: #1a1a1a;
      --muted: #666;
      --line: #ddd;
      --panel: #fff;
      --select: #e8f0fe;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #181818;
        --fg: #eee;
        --muted: #999;
        --line: #333;
        --panel: #202020;
        --select: #1f2c44;
      }
    }
    * {
      box-sizing: border-box;
    }
    body {
      font: 16px/1.5 system-ui, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 0.75rem 1rem;
      background: #1a1a1a;
      color: #fafafa;
      font-weight: 600;
    }
    #banner {
      display: none;
      padding: 0.5rem 1rem;
      background: #fff3cd;
      color: #664d03;
    }
    @media (prefers-color-scheme: dark) {
      #banner {
        background: #4d3b00;
        color: #ffe69c;
      }
    }
    #panes {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    #rail {
      width: 22rem;
      max-width: 40%;
      overflow-y: auto;
      border-right: 1px solid var(--line);
      padding: 0.5rem;
    }
    #main {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.5rem;
    }
    h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin: 0.75rem 0.25rem 0.25rem;
    }
    h3 {
      font-size: 0.95rem;
      margin: 0.75rem 0.25rem 0.25rem;
    }
    .empty {
      color: var(--muted);
      margin: 0.25rem;
    }
    .row {
      display: block;
      width: 100%;
      text-align: left;
      font: inherit;
      color: inherit;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.4rem 0.6rem;
      margin: 0.25rem 0;
      cursor: pointer;
    }
    .row.selected {
      background: var(--select);
    }
    .row .meta {
      color: var(--muted);
      font-size: 0.8rem;
    }
    .row .summary {
      overflow-wrap: anywhere;
    }
    .stale {
      opacity: 0.55;
    }
    pre.detail {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: inherit;
      margin: 0.4rem 0 0;
    }
    #main pre.detail {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.75rem;
    }
    .note {
      color: var(--muted);
    }
    </style>
  </head>
  <body>
    <header>Kiln</header>
    <div id="banner">Kiln is not running.</div>
    <div id="panes">
      <nav id="rail" aria-label="Needs you"></nav>
      <main id="main"></main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
